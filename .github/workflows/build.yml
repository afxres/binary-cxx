name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Environment
        run: bash scripts/setup.sh

      - name: Build Tests
        run: bash scripts/test-multiarch.sh

      - name: Coverage
        run: bash scripts/run-coverage.sh

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          fail-on-error: false
          file: "build-result/lcov.info"
